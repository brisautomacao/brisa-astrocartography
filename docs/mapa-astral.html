<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:#0a0a1a;color:#e0e0f0;overflow-x:hidden}
/* ===== INPUT FORM ===== */
#form-wrap{max-width:500px;margin:60px auto;padding:24px;background:rgba(15,15,40,.9);

.f-row input{width:100%;padding:12px 14px;background:rgba(30,30,60,.6);border:1px solid rgba(147,112,219,.2);

#birth-location{width:100%;padding:12px 14px;background:rgba(30,30,60,.6);border:1px solid rgba(147,112,219,.2);
  border-radius:10px;color:#fff;font-size:16px}
.loc-results{margin-top:4px;max-height:200px;overflow-y:auto;border-radius:8px}
.loc-item{padding:10px 14px;background:rgba(20,20,50,.8);border-bottom:1px solid rgba(147,112,219,.1);
  cursor:pointer;font-size:14px}
.loc-item:hover{background:rgba(40,40,80,.8)}
#gen-btn{width:100%;padding:14px;background:linear-gradient(135deg,#9370DB,#6A0DAD);border:none;
  border-radius:12px;color:#fff;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
#gen-btn:active{transform:scale(.98)}
.error-msg{color:#f44336;text-align:center;padding:10px;font-size:14px;display:none}
.loading{display:none;text-align:center;padding:20px;color:#B19CD9}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(147,112,219,.2);
  border-top-color:#9370DB;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== RESULTS ===== */
#results{display:none;padding:12px;max-width:700px;margin:0 auto}
.section-title{font-size:18px;color:#B19CD9;margin:24px 0 12px;padding-bottom:8px;
  border-bottom:1px solid rgba(147,112,219,.15)}

.triade-card .val{font-size:15px;color:#fff;font-weight:bold}

.planet-card .sym{font-size:24px}
.planet-card .pname{font-size:16px;color:#fff;font-weight:bold}
.planet-card .sign{font-size:13px;color:#aaa}

.planet-card .keywords{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.planet-card .kw{background:rgba(147,112,219,.08);color:#B19CD9;font-size:11px;padding:3px 8px;border-radius:6px}

const BODY_MAP={
  "Sol":Astronomy.Body.Sun,"Lua":Astronomy.Body.Moon,
  "Mercurio":Astronomy.Body.Mercury,"Venus":Astronomy.Body.Venus,
  "Marte":Astronomy.Body.Mars,"Jupiter":Astronomy.Body.Jupiter,
  "Saturno":Astronomy.Body.Saturn,
  "Urano":Astronomy.Body.Uranus,"Netuno":Astronomy.Body.Neptune,"Plutao":Astronomy.Body.Pluto
};

let selectedLat=null,selectedLon=null,selectedName=null;

// City search
let locTimer;
document.getElementById('birth-location').addEventListener('input',function(){
  clearTimeout(locTimer);
  if(this.value.trim().length<3){document.getElementById('loc-results').style.display='none';return}
  const q=this.value.trim();
  locTimer=setTimeout(()=>{
    fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=5&accept-language=pt-BR')
      .then(r=>r.json()).then(data=>{
        const el=document.getElementById('loc-results');
        if(data.length===0){el.innerHTML='<div class="loc-item">Nenhuma cidade encontrada</div>';el.style.display='block';return}
        el.innerHTML=data.map(d=>{
          const name=d.display_name.split(',').slice(0,3).join(',');
          return '<div class="loc-item" onclick="selectLocation('+d.lat+','+d.lon+',\''+name.replace(/'/g,'')+'\')">📍 '+name+'</div>';
        }).join('');
        el.style.display='block';
      }).catch(()=>{});
  },400);
});

function selectLocation(lat,lon,name){
  selectedLat=parseFloat(lat);selectedLon=parseFloat(lon);selectedName=name;
  document.getElementById('birth-location').value=name;
  document.getElementById('loc-results').style.display='none';
}

// Compute ecliptic longitude for a planet
function getEclipticLon(planetName,date){
  const body=BODY_MAP[planetName];
  if(!body)return null;
  const vec=Astronomy.GeoVector(body,date,true);
  const ecl=Astronomy.Ecliptic(vec);
  return((ecl.elon%360)+360)%360;
}

function getNorthNode(date){
  // Days since J2000 epoch
  const j2000=new Date(Date.UTC(2000,0,1,12,0,0));
  const days=(date-j2000)/(1000*60*60*24);
  // Mean node: 125.0445479 - 0.0529539 * days (in degrees)
  let lon=(125.0445479-0.0529539*days)%360;
  if(lon<0)lon+=360;
  return lon;
}

// Compute Ascendant
function getAscendant(date,lat,lon){
  const gstHours=Astronomy.SiderealTime(date);
  const lstDeg=(gstHours*15+lon+360)%360;
  const lstRad=lstDeg*Math.PI/180;
  const eps=23.4397*Math.PI/180;
  const latRad=lat*Math.PI/180;
  // Ascendant = atan2(-cos(LST), sin(LST)*cos(eps) + tan(lat)*sin(eps))
  let ascRad=Math.atan2(
    -Math.cos(lstRad),
    Math.sin(lstRad)*Math.cos(eps)+Math.tan(latRad)*Math.sin(eps)
  );
  let ascDeg=ascRad*180/Math.PI;
  if(ascDeg<0)ascDeg+=360;
  // Quadrant correction: ASC should be 90+ from MC going CCW
  // If formula gives DSC instead, flip 180°
  const mcDeg=getMCfromLST(lstDeg);
  let diff=((ascDeg-mcDeg)%360+360)%360;
  if(diff>180)ascDeg=(ascDeg+180)%360;
  return ascDeg;
}

function getMCfromLST(lstDeg){
  const lstRad=lstDeg*Math.PI/180;
  const eps=23.4397*Math.PI/180;
  let mcRad=Math.atan2(
    Math.sin(lstRad),
    Math.cos(lstRad)*Math.cos(eps)
  );
  let mcDeg=mcRad*180/Math.PI;
  if(mcDeg<0)mcDeg+=360;
  return mcDeg;
}

// Compute MC (Midheaven)
function getMC(date,lon){
  const gstHours=Astronomy.SiderealTime(date);
  const ramcDeg=(gstHours*15+lon+360)%360;
  const ramcRad=ramcDeg*Math.PI/180;
  const eps=23.4397*Math.PI/180;
  // MC ecliptic longitude = atan2(sin(RAMC), cos(RAMC)*cos(eps))
  let mcRad=Math.atan2(
    Math.sin(ramcRad),
    Math.cos(ramcRad)*Math.cos(eps)
  );
  let mcDeg=mcRad*180/Math.PI;
  if(mcDeg<0)mcDeg+=360;
  return mcDeg;
}

// Compute Equal House cusps
function getHouseCusps(ascLon){
  const cusps=[];
  for(let i=0;i<12;i++){
    cusps.push((ascLon+i*30)%360);
  }
  return cusps;
}

// Find house for a planet
function findHouse(planetLon,cusps){
  for(let i=0;i<12;i++){
    const c1=cusps[i];
    const c2=cusps[(i+1)%12];
    if(c2<c1){
      if(planetLon>=c1||planetLon<c2)return i+1;
    }else{
      if(planetLon>=c1&&planetLon<c2)return i+1;
    }
  }
  return 12;
}

// Check retrograde
function isRetrograde(planetName,date){
  if(planetName==="Sol"||planetName==="Nodo Norte")return false;
  const d1=new Date(date.getTime());
  const d2=new Date(date.getTime()+12*3600*1000); // +12 hours
  const lon1=getEclipticLon(planetName,d1);
  const lon2=getEclipticLon(planetName,d2);
  let diff=lon2-lon1;
  if(diff>180)diff-=360;
  if(diff<-180)diff+=360;
  return diff<0;
}

// ============================================================
// GENERATE CHART
// ============================================================
let chartData=null;

function generateChart(){
  const dateStr=document.getElementById('birth-date').value;
  const timeStr=document.getElementById('birth-time').value;
  if(!dateStr||!timeStr){showError("Preencha data e hora");return}
  if(selectedLat===null){showError("Selecione um local da lista");return}

  document.getElementById('loading').style.display='block';
  document.getElementById('error').style.display='none';

  setTimeout(()=>{
    try{
      // Convert local birth time to UTC using longitude-based timezone
      const tzOffset=Math.round(selectedLon/15);
      const localDate=new Date(dateStr+'T'+timeStr+':00');
      const date=new Date(Date.UTC(
        localDate.getFullYear(),localDate.getMonth(),localDate.getDate(),
        localDate.getHours()-tzOffset,localDate.getMinutes()
      ));
      const ascLon=getAscendant(date,selectedLat,selectedLon);
      const mcLon=getMC(date,selectedLon);
      const cusps=getHouseCusps(ascLon);

      // Compute all planets
      const planets={};
      for(const pname of Object.keys(BODY_MAP)){
        const lon=getEclipticLon(pname,date);
        const signIdx=Math.floor(lon/30);
        const degInSign=lon%30;
        const deg=Math.floor(degInSign);
        const mins=Math.floor((degInSign-deg)*60);
        const house=findHouse(lon,cusps);
        const retro=isRetrograde(pname,date);
        planets[pname]={
          lon:lon,signIdx:signIdx,sign:SIGNS_PT[signIdx],
          deg:deg,mins:mins,house:house,retro:retro,
          signData:SIGNS_DATA[signIdx],planetData:PLANETS_DATA[pname]
        };
      }

      // Nodo Norte
      const nnLon=getNorthNode(date);
      const nnSignIdx=Math.floor(nnLon/30);
      const nnDegInSign=nnLon%30;
      const nnDeg=Math.floor(nnDegInSign);
      const nnMins=Math.floor((nnDegInSign-nnDeg)*60);
      const nnHouse=findHouse(nnLon,cusps);
      planets["Nodo Norte"]={
        lon:nnLon,signIdx:nnSignIdx,sign:SIGNS_PT[nnSignIdx],
        deg:nnDeg,mins:nnMins,house:nnHouse,retro:false,
        signData:SIGNS_DATA[nnSignIdx],planetData:PLANETS_DATA["Nodo Norte"]
      };

      // Aspects
      const aspects=[];
      const planetNames=Object.keys(planets);
      for(let i=0;i<planetNames.length;i++){
        for(let j=i+1;j<planetNames.length;j++){
          const p1=planets[planetNames[i]];
          const p2=planets[planetNames[j]];
          if(p1===p2)continue;
          let diff=Math.abs(p1.lon-p2.lon);
          if(diff>180)diff=360-diff;
          for(const[akey,adata]of Object.entries(ASPECTS_DATA)){
            const orb=Math.abs(diff-adata.angle);
            if(orb<=adata.orb){
              aspects.push({
                p1:planetNames[i],p2:planetNames[j],
                aspect:akey,data:adata,orb:orb
              });
            }
          }
        }
      }

      chartData={
        date:date,planets:planets,aspects:aspects,
        cusps:cusps,ascSignIdx:Math.floor(ascLon/30),
        ascDeg:ascLon,mcSignIdx:Math.floor(mcLon/30),mcDeg:mcLon,
        lat:selectedLat,lon:selectedLon,name:selectedName
      };

      renderChart();
    }catch(e){
      showError("Erro: "+(e.message||e));
      console.error(e);
    }
    document.getElementById('loading').style.display='none';
  },100);
}

function showError(msg){
  document.getElementById('error').textContent=msg;
  document.getElementById('error').style.display='block';
  document.getElementById('loading').style.display='none';
}

// ============================================================
// RENDER
// ============================================================
function renderChart(){
  document.getElementById('form-wrap').style.display='none';
  document.getElementById('results').style.display='block';

  const d=chartData;
  const p=d.planets;

  // Chart info
  const dtStr=d.date.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('chart-info').innerHTML=
    '<div style="text-align:center;margin-bottom:16px">'+
    '<div style="font-size:20px;color:#B19CD9">🔮 Mapa Astral</div>'+
    '<div style="font-size:14px;color:#aaa;margin-top:4px">'+dtStr+' as '+
    d.date.getHours().toString().padStart(2,'0')+':'+d.date.getMinutes().toString().padStart(2,'0')+'</div>'+
    '<div style="font-size:13px;color:#888">'+d.name+'</div></div>';

  // Summary
  const sun=p["Sol"],moon=p["Lua"];
  const ascSign=SIGNS_DATA[d.ascSignIdx];
  document.getElementById('summary').innerHTML=
    '<p>Voce tem <span class="highlight">Sol em '+sun.signData.name+'</span>, '+
    '<span class="highlight">Lua em '+moon.signData.name+'</span> e '+
    '<span class="highlight">Ascendente em '+ascSign.name+'</span>.</p>'+
    '<p>Sua essencia (Sol) e '+sun.signData.kw.join(', ')+'. '+
    'Suas emocoes (Lua) sao '+moon.signData.kw.join(', ')+'. '+
    'Sua mascara exterior (Ascendente) e '+ascSign.kw.join(', ')+'.</p>'+
    '<p>O Meio do Ceu (carreira) esta em <span class="highlight">'+SIGNS_DATA[d.mcSignIdx].name+'</span>, '+
    'mostrando uma vocacao '+SIGNS_DATA[d.mcSignIdx].kw.slice(0,3).join(', ')+'.</p>';

  // Tríade
  document.getElementById('triade-section').innerHTML=
    triadeCard("Sol",sun,'#FFD700')+
    triadeCard("Lua",moon,'#C0C0C0')+
    triadeCard("ASC",{signIdx:d.ascSignIdx,deg:Math.floor(d.ascDeg%30),
      mins:Math.floor((d.ascDeg%30-Math.floor(d.ascDeg%30))*60),
      signData:ascSign,planetData:PLANETS_DATA["Sol"]},'rgba(147,112,219,.3)');

  // Planets
  let pHtml='';
  for(const pname of Object.keys(PLANETS_DATA)){
    const pl=p[pname];
    if(!pl)continue;
    const sd=pl.signData;
    const pd=pl.planetData;
    let kwHtml=sd.kw.map(k=>'<span class="kw">'+k+'</span>').join('');
    pHtml+='<div class="planet-card" style="--clr:'+pd.color+'">'+
      '<div class="top">'+
      '<span class="sym" style="color:'+pd.color+'">'+pd.sym+'</span>'+
      '<div><span class="pname">'+pname+'</span>'+
      (pl.retro?'<span class="retro"> ℞ Retrogrado</span>':'')+'</div>'+
      '<span class="house-badge">Casa '+pl.house+'</span></div>'+
      '<div class="sign">'+sd.sym+' '+pl.sign+' '+pl.deg+'°'+pl.mins.toString().padStart(2,'0')+"' ("+sd.element+" / "+sd.quality+" / Regente: "+sd.ruler+')</div>'+
      '<div class="meaning"><b>'+pd.title+':</b> '+pd.desc+'</div>'+
      '<div class="meaning" style="margin-top:6px"><b>Em '+sd.name+':</b> '+sd.desc+'</div>'+
      '<div class="keywords">'+kwHtml+'</div>'+
      '</div>';
  }
  document.getElementById('planets-section').innerHTML=pHtml;

  // Houses
  let hHtml='';
  // Group planets by house
  const housePlanets={};
  for(const[pname,pl]of Object.entries(p)){
    if(!housePlanets[pl.house])housePlanets[pl.house]=[];
    housePlanets[pl.house].push(pname);
  }
  for(let i=0;i<12;i++){
    const hd=HOUSES_DATA[i];
    const cuspLon=d.cusps[i];
    const cuspSignIdx=Math.floor(cuspLon/30);
    const cuspSign=SIGNS_DATA[cuspSignIdx];
    const cuspDeg=Math.floor(cuspLon%30);
    const planetsInHouse=housePlanets[i+1]||[];
    let planetsStr=planetsInHouse.length>0?
      '<div class="hplanets">🪐 Planetas aqui: '+planetsInHouse.map(pn=>PLANETS_DATA[pn].sym+' '+pn).join(', ')+'</div>':'';
    hHtml+='<div class="house-card">'+
      '<div class="hnum">Casa '+hd.n+' - '+cuspSign.sym+' '+cuspSign.name+' '+cuspDeg+'°</div>'+
      '<div class="htheme">'+hd.theme+'</div>'+
      '<div class="hmeaning">'+hd.desc+'</div>'+
      planetsStr+'</div>';
  }
  document.getElementById('houses-section').innerHTML=hHtml;

  // Aspects
  let aHtml='';
  const sortedAspects=d.aspects.slice().sort((a,b)=>a.orb-b.orb);
  for(const a of sortedAspects){
    const ad=a.data;
    const p1=d.planets[a.p1],p2=d.planets[a.p2];
    aHtml+='<div class="aspect-card">'+
      '<span class="asym" style="color:'+p1.planetData.color+'">'+ad.sym+'</span>'+
      '<div class="adesc">'+
      '<span class="aname">'+p1.planetData.sym+' '+a.p1+' '+ad.sym+' '+p2.planetData.sym+' '+a.p2+'</span>'+
      '<span class="aorb"> '+ad.name+' (orbe '+a.orb.toFixed(1)+'°)</span>'+
      '<div class="ameaning">'+ad.desc+' '+ad.pos+'</div></div></div>';
  }
  document.getElementById('aspects-section').innerHTML=aHtml;
}

function triadeCard(label,planet,color){
  const sd=planet.signData||SIGNS_DATA[planet.signIdx];
  return '<div class="triade-card" style="border-color:'+color+'30">'+
    '<div class="sym" style="color:'+color+'">'+(label==='ASC'?sd.sym:PLANETS_DATA[label]?.sym||sd.sym)+'</div>'+
    '<div class="lbl">'+label+'</div>'+
    '<div class="val">'+sd.name+'</div>'+
    '<div class="deg">'+(planet.deg||0)+'°'+(planet.mins||0).toString().padStart(2,'0')+"'</div>"+
    '</div>';
}

function resetForm(){
  document.getElementById('form-wrap').style.display='block';
  document.getElementById('results').style.display='none';
}
</script>
