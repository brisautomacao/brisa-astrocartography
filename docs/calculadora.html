<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculadora Astrocártográfica | Brisa Astral</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="astronomy.min.js"></script>
<style>
@keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:1} }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#0a0a1a;font-family:Georgia,'Times New Roman',serif}

.stars-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}

/* ===== INPUT PANEL ===== */
#input-panel{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:16px;
  overflow-y:auto;background:linear-gradient(135deg,#0a0a1a 0%,#12122e 50%,#0a0a1a 100%)}

#input-card{max-width:480px;width:100%;padding:32px 28px;
  background:rgba(15,15,40,.92);backdrop-filter:blur(20px);
  border:1px solid rgba(147,112,219,.25);border-radius:20px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);animation:fadeUp .6s ease}

#input-card h1{color:#B19CD9;font-size:24px;text-align:center;margin:0 0 4px;
  letter-spacing:1px}
#input-card .subtitle{color:#888;font-size:13px;text-align:center;margin:0 0 24px}

.form-group{margin-bottom:20px}
.form-group label{display:block;color:#B19CD9;font-size:13px;font-weight:bold;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input{width:100%;box-sizing:border-box;padding:12px 14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(147,112,219,.2);
  border-radius:10px;color:#fff;font-size:15px;font-family:inherit;transition:all .2s}
.form-group input:focus{outline:none;border-color:#9370DB;
  background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(147,112,219,.15)}
.form-group input::placeholder{color:#666}
.form-group input[type=date],.form-group input[type=time]{
  color-scheme:dark}

.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}

#location-results{max-height:200px;overflow-y:auto;margin-top:4px}
.loc-item{padding:10px 14px;background:rgba(255,255,255,.04);border-radius:8px;
  margin-bottom:4px;cursor:pointer;font-size:13px;color:#ccc;transition:all .15s}
.loc-item:hover{background:rgba(147,112,219,.15);color:#fff}

#generate-btn{width:100%;padding:14px;margin-top:8px;
  background:linear-gradient(135deg,#9370DB,#6A5ACD);
  border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:bold;
  font-family:inherit;cursor:pointer;letter-spacing:.5px;transition:all .2s;
  box-shadow:0 4px 20px rgba(147,112,219,.3)}
#generate-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(147,112,219,.4)}
#generate-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

#error-msg{color:#ff6b6b;font-size:13px;text-align:center;margin-top:8px;display:none}

.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}

.br-tag{text-align:center;margin-top:16px;font-size:11px;color:#555}
.br-tag a{color:#9370DB;text-decoration:none}

/* ===== MAP ===== */
#map-container{position:fixed;top:0;left:0;width:100%;height:100%;display:none}
#map{position:absolute;top:0;bottom:0;right:0;left:0;z-index:1}
.leaflet-container{background:#0a0a1a!important;font-size:1rem}

/* ===== LEGEND ===== */
#legend-container{position:fixed;top:50px;right:10px;z-index:9997;
  max-width:380px;max-height:85vh;overflow-y:auto;
  background:rgba(10,10,30,.92);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);border-radius:16px;
  font-family:Georgia,serif;box-shadow:0 8px 32px rgba(0,0,0,.5)}

.legend-header{cursor:pointer;padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1)}
.legend-header span:first-child{color:#fff;font-size:15px;font-weight:bold;letter-spacing:1px}
#legend-arrow{color:#9370DB;font-size:18px;transition:transform .3s}

#legend-body{padding:12px 16px;overflow:hidden;transition:max-height .3s ease}

.legend-section{margin-bottom:16px}
.legend-section h4{color:#B19CD9;font-size:13px;text-transform:uppercase;
  letter-spacing:1px;margin:0 0 10px 0}

.planet-card{margin-bottom:10px;padding:10px 12px;
  background:rgba(255,255,255,.06);border-radius:10px}

/* ===== REGENERATE BUTTON ===== */
#regen-btn{position:fixed;top:10px;left:50px;z-index:9999;
  background:rgba(15,15,40,.92);border:1px solid rgba(147,112,219,.3);
  color:#B19CD9;padding:8px 14px;border-radius:10px;cursor:pointer;
  font-size:13px;font-family:inherit;backdrop-filter:blur(10px)}

/* ===== ANALYZE BUTTON ===== */
#analyze-btn{position:fixed;top:10px;right:10px;z-index:9998;
  background:linear-gradient(135deg,#9370DB,#6A5ACD);
  border:none;color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;
  font-size:13px;font-weight:bold;font-family:inherit;
  box-shadow:0 4px 15px rgba(147,112,219,.3);backdrop-filter:blur(10px)}

/* ===== ANALYZE PANEL ===== */
#analyze-panel{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  display:none;align-items:flex-start;justify-content:center;padding:16px;
  overflow-y:auto;background:rgba(5,5,15,.85);backdrop-filter:blur(8px)}

#analyze-card{max-width:600px;width:100%;margin-top:30px;
  background:rgba(15,15,40,.95);border:1px solid rgba(147,112,219,.25);
  border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.6);padding:24px;
  animation:fadeUp .4s ease}

#analyze-card h2{color:#B19CD9;font-size:20px;margin:0 0 4px;text-align:center}
#analyze-card .sub{color:#888;font-size:12px;text-align:center;margin:0 0 20px}

#city-search-wrap{position:relative;margin-bottom:16px}
#city-search-input{width:100%;box-sizing:border-box;padding:12px 14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(147,112,219,.2);
  border-radius:10px;color:#fff;font-size:15px;font-family:inherit}
#city-search-input:focus{outline:none;border-color:#9370DB;
  background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(147,112,219,.15)}
#city-results{max-height:180px;overflow-y:auto;margin-top:4px;
  border-radius:8px;background:rgba(20,20,50,.95);
  border:1px solid rgba(147,112,219,.15);display:none;position:relative;z-index:10}
#city-results .loc-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#ccc;
  border-bottom:1px solid rgba(255,255,255,.05)}
#city-results .loc-item:hover{background:rgba(147,112,219,.15);color:#fff}

#analyze-close{position:relative;float:right;margin-top:-50px;margin-right:-10px;
  background:rgba(255,100,100,.15);border:1px solid rgba(255,100,100,.3);
  color:#ff6b6b;width:32px;height:32px;border-radius:50%;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center}

.score-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.score-fill{height:100%;border-radius:4px;transition:width .6s ease}
.score-row{margin-bottom:14px}
.score-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.score-label .name{font-size:14px;color:#ddd}
.score-label .val{font-size:14px;font-weight:bold}

.planet-influence{display:flex;align-items:center;gap:8px;padding:8px 10px;
  margin-bottom:6px;border-radius:8px;font-size:12px}
.planet-influence.pos{background:rgba(50,200,50,.08);border-left:3px solid #4CAF50}
.planet-influence.neg{background:rgba(255,80,80,.08);border-left:3px solid #f44336}
.planet-influence.neu{background:rgba(255,193,7,.08);border-left:3px solid #FFC107}
.planet-influence .sym{font-size:18px}
.planet-influence .desc{color:#bbb;flex:1}
.planet-influence .strength{font-weight:bold;font-size:11px;white-space:nowrap}

.city-verdict{padding:14px;border-radius:12px;margin:12px 0;font-size:14px;line-height:1.6}
.city-verdict.great{background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3)}
.city-verdict.good{background:rgba(33,150,243,.12);border:1px solid rgba(33,150,243,.3)}
.city-verdict.mixed{background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.3)}
.city-verdict.bad{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3)}
.city-verdict.terrible{background:rgba(120,0,0,.15);border:1px solid rgba(180,0,0,.4)}

.rank-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;
  border-radius:10px;cursor:pointer;transition:all .15s}
.rank-row:hover{background:rgba(147,112,219,.1)}
.rank-num{font-size:18px;font-weight:bold;width:28px;text-align:center}
.rank-info{flex:1}
.rank-info .rname{font-size:14px;color:#ddd}
.rank-info .rscore{font-size:11px;color:#888}

.tab-btns{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(147,112,219,.2);
  background:transparent;color:#aaa;font-size:13px;cursor:pointer;font-family:inherit}
.tab-btn.active{background:rgba(147,112,219,.15);color:#fff;border-color:#9370DB}
  padding:8px 16px;background:rgba(147,112,219,.3);backdrop-filter:blur(10px);
  border:1px solid rgba(147,112,219,.3);border-radius:10px;color:#fff;
  font-size:13px;cursor:pointer;font-family:inherit;display:none;transition:all .2s}
#regen-btn:hover{background:rgba(147,112,219,.5)}

/* ===== LOADING OVERLAY ===== */
#loading{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  display:none;align-items:center;justify-content:center;
  background:rgba(10,10,26,.9);backdrop-filter:blur(8px)}
#loading .text{color:#B19CD9;font-size:18px;text-align:center}
</style>
</head>
<body>

<div class="stars-bg" id="stars"></div>

<!-- INPUT PANEL -->
<div id="input-panel">
  <div id="input-card">
    <h1>🔮 Mapa Astrocártográfico</h1>
    <p class="subtitle">Descubra as energias planetárias dos lugares do mundo</p>

    <div class="form-group">
      <label>Data de Nascimento</label>
      <input type="date" id="birth-date" min="1900-01-01" max="2099-12-31">
    </div>

    <div class="form-group">
      <label>Hora de Nascimento</label>
      <input type="time" id="birth-time" value="12:00">
    </div>

    <div class="form-group">
      <label>Local de Nascimento</label>
      <input type="text" id="birth-location" placeholder="Ex: Porto Alegre, RS" autocomplete="off">
      <div id="location-results"></div>
    </div>

    <button id="generate-btn" onclick="generateMap()">✨ Gerar Meu Mapa</button>
    <div id="error-msg"></div>

    <div class="br-tag">✨ <a href="https://brisaastral.ai" target="_blank">Brisa Astral</a></div>
  </div>
</div>

<!-- REGENERATE BUTTON -->
<button id="regen-btn" onclick="resetForm()">↩ Novo Mapa</button>

<!-- ANALYZE BUTTON -->
<button id="analyze-btn" onclick="openAnalyze()" style="display:none">🔍 Analisar Cidade</button>

<!-- ANALYZE PANEL -->
<div id="analyze-panel">
  <div id="analyze-card">
    <button id="analyze-close" onclick="closeAnalyze()">✕</button>
    <h2>🔍 Análise de Cidade</h2>
    <p class="sub">Descubra como seria sua vida em qualquer lugar do mundo</p>

    <div class="tab-btns">
      <button class="tab-btn active" onclick="switchTab('search')" id="tab-search">🔎 Buscar Cidade</button>
      <button class="tab-btn" onclick="switchTab('best')" id="tab-best">🏆 Melhores Lugares</button>
      <button class="tab-btn" onclick="switchTab('worst')" id="tab-worst">⚠️ Piores Lugares</button>
    </div>

    <div id="tab-content-search">
      <div id="city-search-wrap">
        <input type="text" id="city-search-input" placeholder="Digite o nome de uma cidade..." autocomplete="off">
        <div id="city-results"></div>
      </div>
      <div id="city-report"></div>
    </div>

    <div id="tab-content-best" style="display:none"></div>
    <div id="tab-content-worst" style="display:none"></div>
  </div>
</div>

<!-- MAP -->
<div id="map-container">
  <div id="map"></div>
</div>

<!-- LEGEND -->
<div id="legend-container" style="display:none">
  <div class="legend-header" onclick="toggleLegend()">
    <span>🔮 Legenda &amp; Significados</span>
    <span id="legend-arrow">▲</span>
  </div>
  <div id="legend-body"></div>
</div>

<!-- LOADING -->
<div id="loading"><div class="text"><span class="spinner"></span>Calculando posições planetárias...</div></div>

<script>
// ============================================================
// PLANET DATA
// ============================================================
const PLANETS = {

    mc:"AMOR NO TRABALHO - carreira artistica, estetica, moda, beleza, diplomacia.",
    ic:"AMOR EM CASA - lar bonito, harmonia familiar, ambiente estetico e agradavel.",
    asc:"AMOR NO MUNDO - voce fica irresistivel, magnetica, atraente, charme natural.",
    dsc:"AMOR NO AMOR - romance puro, parceiros apaixonados, relacionamentos harmonicos."},
  "Marte":{symbol:"♂",color:"#FF0000",keyword:"ACAO · Energia · Coragem · Conquista",
    mc:"ACAO NO TRABALHO - empreendedorismo, lideranca agressiva, competitividade, esforco.",
    ic:"ACAO EM CASA - energia no lar, reformas, trabalhos manuais, disputas familiares.",
    asc:"ACAO NO MUNDO - presenca forte, coragem, iniciativa, voce toma o espaco.",
    dsc:"ACAO NO AMOR - paixao intensa, parceiro energetico, atracao fisica poderosa."},
  "Jupiter":{symbol:"♃",color:"#4169E1",keyword:"SORTE · Expansao · Abundancia · Crescimento",
    mc:"SORTE NO TRABALHO - oportunidades, promocoes, abundancia financeira, sucesso.",
    ic:"SORTE EM CASA - familia abencoada, lar espacoso, crescimento domestico.",
    asc:"SORTE NO MUNDO - otimismo, confianca, voce atrai boas oportunidades.",
    dsc:"SORTE NO AMOR - parceiro generoso, relacionamento prospero, amor que expande."},
  "Saturno":{symbol:"♄",color:"#5F9EA0",keyword:"ESTRUTURA · Disciplina · Responsabilidade · Tempo",
    mc:"ESTRUTURA NO TRABALHO - carreira solida, construcao a longo prazo, respeito.",
    ic:"ESTRUTURA EM CASA - lar organizado, familia tradicional, responsabilidade domestica.",
    asc:"ESTRUTURA NO MUNDO - seriedade, maturidade, confiabilidade, presenca respeitavel.",
    dsc:"ESTRUTURA NO AMOR - parceiro estavel, compromisso serio, amor duradouro."},
  "Urano":{symbol:"♅",color:"#00CED1",keyword:"MUDANCA · Inovacao · Liberdade · RebelDia",
    mc:"MUDANCA NO TRABALHO - tecnologia, inovacao, startups, mudancas subitas de carreira.",
    ic:"MUDANCA EM CASA - mudancas de residencia, lar nao convencional, familia diferente.",

    dsc:"MUDANCA NO AMOR - parceiro diferente, amor nao convencional, relacionamento livre."},

    mc:"ESPIRITUALIDADE NO TRABALHO - arte, misticismo, cura, musica, inspiracao.",
    ic:"ESPIRITUALIDADE EM CASA - lar mistico, intuicao familiar, lar como refugio espiritual.",
    asc:"ESPIRITUALIDADE NO MUNDO - aura mistica, sensibilidade artistica, empatia profunda.",
    dsc:"ESPIRITUALIDADE NO AMOR - amor idealizado, parceiro artistico, conexao de alma."},
  "Plutao":{symbol:"♇",color:"#CD5C5C",keyword:"PODER · Transformacao · Renascimento · Intensidade",
    mc:"PODER NO TRABALHO - influencia, controle, grande fortuna, transformacao profissional.",
    ic:"PODER EM CASA - transformacao familiar, raizes profundas, heranca poderosa.",
    asc:"PODER NO MUNDO - intensidade magnetica, presenca transformadora, voce muda ambientes.",
    dsc:"PODER NO AMOR - paixao obsessiva, parceiro intenso, relacionamento transformador."},
  "Nodo Norte":{symbol:"☊",color:"#9370DB",keyword:"DESTINO · Proposito · Evolucao · Karma",
    mc:"DESTINO NO TRABALHO - missao profissional, carreira como proposito de vida.",
    ic:"DESTINO EM CASA - proposito ligado a familia, lar como missao de vida.",
    asc:"DESTINO NO MUNDO - evolucao pessoal, ser quem voce nasceu para ser.",
    dsc:"DESTINO NO AMOR - parcerias karmicas, encontros que mudam seu caminho de vida."}
};
const PLANET_ORDER = ["Sol","Lua","Mercurio","Venus","Marte","Jupiter","Saturno","Urano","Netuno","Plutao","Nodo Norte"];

const BODY_MAP = {
  "Sol":Astronomy.Body.Sun, "Lua":Astronomy.Body.Moon,
  "Mercurio":Astronomy.Body.Mercury, "Venus":Astronomy.Body.Venus,
  "Marte":Astronomy.Body.Mars, "Jupiter":Astronomy.Body.Jupiter,
  "Saturno":Astronomy.Body.Saturn, "Urano":Astronomy.Body.Uranus,
  "Netuno":Astronomy.Body.Neptune, "Plutao":Astronomy.Body.Pluto
};

const ANGLE_INFO = {
  MC:{symbol:"MC", desc:"VOCACAO · CARREIRA · STATUS PUBLICO · O QUE VOCE CONSTROI NO MUNDO"},
  IC:{symbol:"IC", desc:"LAR · FAMILIA · RAIZES · VIDA PRIVADA · DE ONDE VOCE VEIO"},
  ASC:{symbol:"ASC",desc:"PERSONALIDADE · COMO VOCE SE APRESENTA · PRIMEIRA IMPRESSAO"},
  DSC:{symbol:"DSC",desc:"RELACIONAMENTOS · PARCERIAS · AMOR · O QUE VOCE ATRAI"}
};

// ============================================================
// STARS BACKGROUND
// ============================================================
(function(){const c=document.getElementById('stars');
for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
s.style.animationDelay=Math.random()*3+'s';
const sz=[1,1,2,2,3][Math.floor(Math.random()*5)];s.style.width=sz+'px';s.style.height=sz+'px';
c.appendChild(s)}})();

// ============================================================
// LOCATION SEARCH (Nominatim)
// ============================================================
let selectedLat=null, selectedLon=null, selectedName='';
let searchTimer;
const locInput=document.getElementById('birth-location');
const locResults=document.getElementById('location-results');

locInput.addEventListener('input',function(){
  selectedLat=null;selectedLon=null;
  clearTimeout(searchTimer);
  if(this.value.trim().length<3){locResults.innerHTML='';return}
  searchTimer=setTimeout(()=>searchLocation(this.value.trim()),400);
});

function searchLocation(q){
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&accept-language=pt-BR`)
    .then(r=>r.json()).then(data=>{
      locResults.innerHTML=data.map(d=>{
        const lat=parseFloat(d.lat).toFixed(4),lon=parseFloat(d.lon).toFixed(4);
        return `<div class="loc-item" onclick="selectLocation(${d.lat},${d.lon},'${d.display_name.substring(0,60).replace(/'/g,"")}')">📍 ${d.display_name.substring(0,60)}</div>`
      }).join('');
    }).catch(()=>{locResults.innerHTML='<div class="loc-item">Erro na busca</div>'});
}

function selectLocation(lat,lon,name){
  selectedLat=lat;selectedLon=lon;selectedName=name;
  locInput.value=name;
  locResults.innerHTML='';
}

// ============================================================
// ASTROLOGY CALCULATIONS
// ============================================================
function normalizeLon(lon){while(lon>180)lon-=360;while(lon<-180)lon+=360;return lon}

function getPlanetRaDec(name, date){
  if(name==="Nodo Norte"){
    // Mean lunar node
    const jd=(date.getTime()/86400000)+2440587.5;
    const T=(jd-2451545.0)/36525;
    let nodeLon=125.0445479-1934.1362891*T+0.0020754*T*T+T*T*T/467441;
    nodeLon=((nodeLon%360)+360)%360;
    // Convert ecliptic to equatorial
    const eps=23.4393*Math.PI/180;
    const lr=nodeLon*Math.PI/180;
    let ra=Math.atan2(Math.sin(lr)*Math.cos(eps),Math.cos(lr));
    let dec=Math.asin(Math.sin(eps)*Math.sin(lr));
    let raDeg=ra*180/Math.PI;while(raDeg<0)raDeg+=360;
    return{ra:raDeg,dec:dec*180/Math.PI};
  }
  const body=BODY_MAP[name];
  const observer=new Astronomy.Observer(0,0,0);
  const equ=Astronomy.Equator(body,date,observer,true,true);
  return{ra:equ.ra*15,dec:equ.dec}; // ra: hours→degrees
}

function computeLines(ra,dec,gstDeg){
  const result={mc:[],ic:[],asc:[],dsc:[]};

  // MC/IC are vertical lines (straight on map) - wrap in segment array
  const mcLon=normalizeLon(ra-gstDeg);
  const icLon=normalizeLon(mcLon+180);
  const mcPts=[],icPts=[];
  for(let lat=-85;lat<=85;lat+=1){
    mcPts.push([lat,mcLon]);
    icPts.push([lat,icLon]);
  }
  result.mc=[mcPts];
  result.ic=[icPts];

  // ASC/DSC are curved (depend on latitude)
  let curAsc=[],curDsc=[];
  for(let lat=-85;lat<=85;lat+=1){
    const latR=lat*Math.PI/180;
    const decR=dec*Math.PI/180;
    const arg=-Math.tan(latR)*Math.tan(decR);
    if(Math.abs(arg)>1){
      if(curAsc.length>1)result.asc.push(curAsc);
      if(curDsc.length>1)result.dsc.push(curDsc);
      curAsc=[];curDsc=[];continue;
    }
    const h0=Math.acos(arg)*180/Math.PI;
    let ascLon=normalizeLon(ra-gstDeg-h0);
    let dscLon=normalizeLon(ra-gstDeg+h0);

    // Handle longitude wraps
    if(curAsc.length>0&&Math.abs(ascLon-curAsc[curAsc.length-1][1])>180){
      if(curAsc.length>1)result.asc.push(curAsc);curAsc=[];
    }
    if(curDsc.length>0&&Math.abs(dscLon-curDsc[curDsc.length-1][1])>180){
      if(curDsc.length>1)result.dsc.push(curDsc);curDsc=[];
    }
    curAsc.push([lat,ascLon]);
    curDsc.push([lat,dscLon]);
  }
  if(curAsc.length>1)result.asc.push(curAsc);
  if(curDsc.length>1)result.dsc.push(curDsc);

  return result;
}

let leafletMap=null;

function generateMap(){
  const dateVal=document.getElementById('birth-date').value;
  const timeVal=document.getElementById('birth-time').value;
  const errEl=document.getElementById('error-msg');
  errEl.style.display='none';

  if(!dateVal){errEl.textContent='Por favor, informe a data de nascimento';errEl.style.display='block';return}
  if(!selectedLat||!selectedLon){errEl.textContent='Por favor, selecione um local da lista';errEl.style.display='block';return}

  const btn=document.getElementById('generate-btn');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Calculando...';
  document.getElementById('loading').style.display='flex';

  setTimeout(()=>{
    try{
      // Parse date/time and convert to UTC
      const [yr,mo,dy]=dateVal.split('-').map(Number);
      const [hr,mi]=(timeVal||'12:00').split(':').map(Number);
      const tzOffset=Math.round(selectedLon/15); // approximate timezone
      const utcHr=hr-tzOffset;
      const date=new Date(Date.UTC(yr,mo-1,dy,utcHr,mi,0));

      // Calculate GST
      const gstHours=Astronomy.SiderealTime(date);
      const gstDeg=gstHours*15;
      lastBirthData={date:date,gstDeg:gstDeg};

      // Create map
      if(leafletMap){leafletMap.remove();leafletMap=null}
      document.getElementById('input-panel').style.display='none';
      document.getElementById('map-container').style.display='block';
      document.getElementById('regen-btn').style.display='block';

      leafletMap=L.map('map',{center:[20,0],zoom:2,zoomControl:true,renderer:L.svg()});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {attribution:'© OpenStreetMap, © CARTO',subdomains:'abc',maxZoom:18}
      ).addTo(leafletMap);

      // Birth location marker
      const birthIcon=L.divIcon({html:'⭐',iconSize:[30,30],className:'birth-marker',iconAnchor:[15,15]});
      L.marker([selectedLat,selectedLon],{icon:birthIcon}).bindPopup(
        `<div style="font-family:Georgia,serif;color:#333;min-width:200px">
        <b style="color:#9370DB">⭐ Local de Nascimento</b><br>
        ${selectedName}<br>${yr}-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')} ${String(hr).padStart(2,'0')}:${String(mi).padStart(2,'0')}<br>
        ${selectedLat.toFixed(4)}°, ${selectedLon.toFixed(4)}°</div>`
      ).addTo(leafletMap);

      // Draw planet lines
      for(const pname of PLANET_ORDER){
        try{
        const info=PLANETS[pname];
        const pos=getPlanetRaDec(pname,date);
        const lines=computeLines(pos.ra,pos.dec,gstDeg);

        const angles=[
          {key:'mc',style:{weight:4,opacity:.85,dashArray:null}},
          {key:'ic',style:{weight:2,opacity:.6,dashArray:'12,8'}},
          {key:'asc',style:{weight:4,opacity:.85,dashArray:null}},
          {key:'dsc',style:{weight:2,opacity:.5,dashArray:'2,6'}}
        ];

        for(const ang of angles){
          const segs=lines[ang.key];
          if(!segs||segs.length===0)continue;
          for(let si=0;si<segs.length;si++){
            const seg=segs[si];
            if(!seg||seg.length<2)continue;
            const meaning=info[ang.key];
            const aData=ANGLE_INFO[ang.key.toUpperCase()];
            const popupHtml='<div style="font-family:Georgia,serif;color:#333;min-width:260px;max-width:320px"><h3 style="color:'+info.color+';margin:0 0 4px">'+info.symbol+' '+pname+' '+aData.symbol+'</h3><p style="font-size:11px;color:#666;margin:0 0 8px">'+info.keyword+'</p><p style="font-size:11px;color:#888;margin:0 0 8px">'+aData.desc+'</p><div style="background:'+info.color+'22;border-left:3px solid '+info.color+';padding:8px;border-radius:4px;font-size:12px;color:#333">'+meaning+'</div></div>';

            // Glow effect for strong lines
            if(ang.style.weight>=3){
              L.polyline(seg,{color:info.color,weight:ang.style.weight+6,opacity:.15,smoothFactor:1}).addTo(leafletMap);
            }
            L.polyline(seg,{color:info.color,weight:ang.style.weight,opacity:ang.style.opacity,
              dashArray:ang.style.dashArray,smoothFactor:1}).addTo(leafletMap).bindPopup(popupHtml,{maxWidth:350}).bindTooltip(info.symbol+' '+pname+' '+aData.symbol);
          }
        }
        }catch(pe){console.error('Planet error:',pname,pe.message)}
      }

      // Show legend
      buildLegend();
      document.getElementById('legend-container').style.display='block';
      document.getElementById('analyze-btn').style.display='block';

      document.getElementById('loading').style.display='none';
    }catch(e){
      document.getElementById('loading').style.display='none';
      const errMsg=e&&e.message?e.message:'Erro desconhecido';
      console.error('MapGen error:',e);
      errEl.textContent='Erro: '+errMsg;errEl.style.display='block';
      btn.disabled=false;btn.innerHTML='✨ Gerar Meu Mapa';
    }
  },100);
}

// Calculate distance (in degrees longitude) from city to a planet line
function distToLine(cityLon,cityLat,ra,dec,gstDeg,angle){
  const mcLon=normalizeLon(ra-gstDeg);
  if(angle==='mc'){return Math.min(Math.abs(cityLon-mcLon),360-Math.abs(cityLon-mcLon))}
  if(angle==='ic'){const icLon=normalizeLon(mcLon+180);return Math.min(Math.abs(cityLon-icLon),360-Math.abs(cityLon-icLon))}
  // ASC/DSC depend on latitude
  const latR=cityLat*Math.PI/180,decR=dec*Math.PI/180;
  const arg=-Math.tan(latR)*Math.tan(decR);
  if(Math.abs(arg)>1)return 999; // line doesn't exist at this latitude
  const h0=Math.acos(arg)*180/Math.PI;
  if(angle==='asc'){const lon=normalizeLon(ra-gstDeg-h0);return Math.min(Math.abs(cityLon-lon),360-Math.abs(cityLon-lon))}
  if(angle==='dsc'){const lon=normalizeLon(ra-gstDeg+h0);return Math.min(Math.abs(cityLon-lon),360-Math.abs(cityLon-lon))}
  return 999;
}

// Score a city: returns {total, areas:{}, influences:[], verdict}
function scoreCity(lat,lon){
  const areas={};
  const influences=[];
  let totalPos=0,totalNeg=0;

  for(const pname of PLANET_ORDER){
    const pos=getPlanetRaDec(pname,lastBirthData.date);
    const pol=PLANET_POLARITY[pname];
    const info=PLANETS[pname];

    for(const angle of ['mc','ic','asc','dsc']){
      const d=distToLine(lon,lat,pos.ra,pos.dec,lastBirthData.gstDeg,angle);
      if(d>5)continue;

      let strength;
      if(d<0.5)strength=3;
      else if(d<1)strength=2;
      else if(d<2)strength=1;
      else strength=0.5;

      const lineW=LINE_WEIGHT[angle];
      const score=strength*lineW;
      const polarity=pol==='pos'?1:(pol==='neg'?-1:0);

      if(pol==='pos')totalPos+=score;
      else if(pol==='neg')totalNeg+=score;

      // Life area scoring
      for(const[area,weights]of Object.entries(LIFE_AREAS)){
        if(weights[pname]){
          const areaScore=score*weights[pname]*polarity;
          areas[area]=(areas[area]||0)+areaScore;
        }
      }

      const strengthLabel=strength>=3?'EXTREMO':strength>=2?'MUITO FORTE':strength>=1?'FORTE':'MODERADO';
      const distKm=Math.round(d*111);
      influences.push({planet:pname,symbol:info.symbol,angle:angle.toUpperCase(),
        polarity:pol,distDeg:d,distKm:distKm,strength:strengthLabel,score:score,
        meaning:info[angle],color:info.color,keyword:info.keyword});
    }
  }

  // Sort influences by strength (closest first)
  influences.sort((a,b)=>a.distDeg-b.distDeg);

  const net=totalPos-totalNeg;
  let verdict,verdictClass,verdictText;

  if(net>=25){verdict='great';verdictText='🌟 LUGAR FANTÁSTICO! As energias planetárias aqui favorecem muito sua vida. Otimo para prosperidade e crescimento.'}
  else if(net>=10){verdict='good';verdictText='✨ BOM LUGAR! Energias positivas superam os desafios. Uma boa escolha para morar ou visitar.'}
  else if(net>=-5){verdict='mixed';verdictText='⚖️ LUGAR MISTO. Ha energias boas e desafiadoras. Depende do que voce busca.'}
  else if(net>=-20){verdict='bad';verdictText='⚠️ LUGAR DIFÍCIL. Mais desafios do que facilidades. Pode ser bom para crescimento pessoal, mas exigira esforco.'}
  else{verdict='terrible';verdictText='🚫 LUGAR MUITO DESAFIADOR. As energias planetarias aqui trazem muitos obstaculos. Considere outro lugar se possivel.'}

  return{total:net,areas,influences,verdict,verdictClass:verdict,verdictText,totalPos,totalNeg};
}

function formatReport(lat,lon,name){
  const s=scoreCity(lat,lon);

  // Verdict
  html+='<div class="city-verdict '+s.verdictClass+'"><b>'+s.verdictText+'</b></div>';

  // Scores by life area
  html+='<h4 style="color:#B19CD9;font-size:14px;margin:16px 0 10px">📊 Pontos Fortes e Fracos</h4>';

    const color=score>10?'#4CAF50':score>-5?'#FFC107':score>-15?'#FF6B35':'#f44336';
    const label=score>15?'MUITO BOM':score>5?'Bom':score>-5?'Neutro':score>-15?'Ruim':'MUITO RUIM';

  return html;
}

        const color=s.total>=10?'#4CAF50':s.total>=-5?'#FFC107':s.total>=-20?'#FF6B35':'#f44336';
        const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        return '<div class="rank-row" onclick="flyToCity('+c.lat+','+c.lon+',\''+c.name.replace(/'/g,'')+'\')"><span class="rank-num" style="color:'+color+'">'+(medal||'#'+(i+1))+'</span><div class="rank-info"><div class="rname">'+c.name+'</div><div class="rscore">Pontos: '+s.total+' | Positivo: +'+s.totalPos+' | Negativo: -'+s.totalNeg+'</div></div></div>';
      }).join('');
  }
}

function flyToCity(lat,lon,name){
  closeAnalyze();
  leafletMap.flyTo([lat,lon],5,{duration:1.5});
  setTimeout(()=>{
    // Show popup at city
    const report=formatReport(lat,lon,name);
    L.popup({maxWidth:400}).setLatLng([lat,lon]).setContent(
      '<div style="font-family:Georgia,serif;max-width:380px"><h3 style="color:#9370DB;margin:0 0 8px">📍 '+name+'</h3>'+report+'</div>'
    ).openOn(leafletMap);
  },1600);
}

// City search
let citySearchTimer;
document.addEventListener('DOMContentLoaded',function(){
  const cityInput=document.getElementById('city-search-input');
  if(!cityInput)return;
  cityInput.addEventListener('input',function(){
    clearTimeout(citySearchTimer);
    if(this.value.trim().length<3){
      document.getElementById('city-results').style.display='none';
      return;
    }
    const q=this.value.trim();
    citySearchTimer=setTimeout(()=>{
      fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=5&accept-language=pt-BR')
        .then(r=>r.json()).then(data=>{
          const el=document.getElementById('city-results');
          if(data.length===0){el.innerHTML='<div class="loc-item">Nenhuma cidade encontrada</div>';el.style.display='block';return}
          el.innerHTML=data.map(d=>{
            const name=d.display_name.split(',').slice(0,3).join(',');
            return '<div class="loc-item" onclick="analyzeCityResult('+d.lat+','+d.lon+',\''+name.replace(/'/g,'')+'\')">📍 '+name+'</div>';
          }).join('');
          el.style.display='block';
        }).catch(()=>{});
    },400);
  });
});

function analyzeCityResult(lat,lon,name){
  document.getElementById('city-results').style.display='none';
  document.getElementById('city-search-input').value=name;
  document.getElementById('city-report').innerHTML='<div style="text-align:center;padding:20px;color:#888"><span class="spinner"></span>Analisando...</div>';
  setTimeout(()=>{
    document.getElementById('city-report').innerHTML=formatReport(parseFloat(lat),parseFloat(lon),name);
  },100);
}
</script>
